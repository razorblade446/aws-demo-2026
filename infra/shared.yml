AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shared infrastructure - VPC, RDS MySQL, security groups, and SSM parameters.
  Schema bootstrap runs in the producer EC2 UserData on first boot.

Parameters:
  DBPassword:
    Type: String
    NoEcho: true
    Default: changeme123

  DBUser:
    Type: String
    Default: admin

Resources:

  # ── VPC ────────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: app-vpc

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  # Two public subnets (different AZs) - required by RDS subnet group

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  Subnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ── Security Groups ─────────────────────────────────────────────────────────

  AppKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: app-key-pair

  ProducerEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Producer EC2 - port 3000 inbound from internet; port 22 bastion SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  ProcessorEc2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Processor EC2 - no inbound
      VpcId: !Ref VPC

  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL - port 3306 from EC2 only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ProducerEc2Sg
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ProcessorEc2Sg
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSg

  # Lambda functions SG — no inbound; outbound to RDS and Kafka within VPC.
  LambdaSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions - outbound to RDS and Kafka only
      VpcId: !Ref VPC

  # VPC endpoint ENI — inbound HTTPS from LambdaSg so Lambda can reach CloudWatch Logs.
  EndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC endpoint ENI - HTTPS from Lambda
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSg

  # VPC Interface Endpoints — let VPC-attached Lambda reach AWS services without NAT.
  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EndpointSg
      PrivateDnsEnabled: true

  LambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EndpointSg
      PrivateDnsEnabled: true

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EndpointSg
      PrivateDnsEnabled: true

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EndpointSg
      PrivateDnsEnabled: true

  # ── SSM Parameters (String, not SecureString - CFN limitation) ─────────────

  DBUserParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/app/db/user"
      Type: String
      Value: !Ref DBUser

  DBPasswordParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/app/db/password"
      Type: String
      Value: !Ref DBPassword

  # ── ECR Repositories ────────────────────────────────────────────────────────

  ProducerRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aws2026/producer
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  ProcessorRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aws2026/solution-basic
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  SolutionKafkaLambdaRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aws2026/solution-kafka-lambda
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  # ── S3 Artifacts Bucket ─────────────────────────────────────────────────────

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── RDS MySQL ───────────────────────────────────────────────────────────────

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Demo public subnet group
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: mysql
      EngineVersion: '8.0'
      AllocatedStorage: '20'
      StorageType: gp2
      DBName: producer
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSg
      MultiAZ: false
      PubliclyAccessible: true
      DeletionProtection: false
      BackupRetentionPeriod: 0

Outputs:

  VpcId:
    Value: !Ref VPC
    Export:
      Name: app-VpcId

  PublicSubnetId:
    Value: !Ref PublicSubnet1
    Export:
      Name: app-PublicSubnetId

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: app-PublicSubnet2Id

  RdsSgId:
    Value: !Ref RdsSg
    Export:
      Name: app-RdsSgId

  ProducerEc2SgId:
    Value: !Ref ProducerEc2Sg
    Export:
      Name: app-ProducerEc2SgId

  ProcessorEc2SgId:
    Value: !Ref ProcessorEc2Sg
    Export:
      Name: app-ProcessorEc2SgId

  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: app-RDSEndpoint

  RDSPort:
    Value: !GetAtt RDSInstance.Endpoint.Port
    Export:
      Name: app-RDSPort

  ProducerECRUri:
    Value: !GetAtt ProducerRepo.RepositoryUri
    Export:
      Name: app-ProducerECRUri

  ProcessorECRUri:
    Value: !GetAtt ProcessorRepo.RepositoryUri
    Export:
      Name: app-ProcessorECRUri

  DBUserParamName:
    Value: !Ref DBUserParam
    Export:
      Name: app-DBUserParamName

  DBPasswordParamName:
    Value: !Ref DBPasswordParam
    Export:
      Name: app-DBPasswordParamName

  LambdaSgId:
    Value: !Ref LambdaSg
    Export:
      Name: app-LambdaSgId

  SolutionKafkaLambdaECRUri:
    Value: !GetAtt SolutionKafkaLambdaRepo.RepositoryUri
    Export:
      Name: app-SolutionKafkaLambdaECRUri

  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: app-ArtifactsBucketName

  KeyPairName:
    Value: !Ref AppKeyPair
    Export:
      Name: app-KeyPairName

  KeyPairId:
    Value: !GetAtt AppKeyPair.KeyPairId
    Description: Use with SSM to retrieve the private key - /ec2/keypair/{KeyPairId}
    Export:
      Name: app-KeyPairId
